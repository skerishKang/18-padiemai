name: Padiem Chat real UI capture

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/padiem-chat-product-film-capture.yml"
      - "scripts/capture-padiem-chat-product-film.mjs"

permissions:
  contents: read

jobs:
  capture:
    name: Capture real public Padiem Chat UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Playwright
        run: npm install --no-save --ignore-scripts playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture public UI
        run: node scripts/capture-padiem-chat-product-film.mjs

      - name: Encode web MP4 and Album WebP
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -loglevel error -y \
            -i capture-artifacts/padiem-chat-product-film-v1.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset medium -crf 20 -movflags +faststart \
            capture-artifacts/padiem-chat-product-film-v1.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -i capture-artifacts/padiem-chat-product-still-v1.png \
            -c:v libwebp -quality 84 \
            capture-artifacts/padiem-chat-product-still-v1.webp
          sha256sum \
            capture-artifacts/padiem-chat-product-film-v1.mp4 \
            capture-artifacts/padiem-chat-product-still-v1.webp \
            > capture-artifacts/SHA256SUMS.txt
          ffprobe -v error -show_entries format=duration,size,format_name \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate \
            -of json capture-artifacts/padiem-chat-product-film-v1.mp4 \
            > capture-artifacts/film-metadata.json

      - name: Enforce media contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          meta = json.loads(Path("capture-artifacts/film-metadata.json").read_text())
          duration = float(meta["format"]["duration"])
          video = next(s for s in meta["streams"] if s.get("codec_name") == "h264")
          assert 15 <= duration <= 40, f"duration outside 15-40s contract: {duration}"
          assert (video.get("width"), video.get("height")) == (1440, 900), video
          assert video.get("pix_fmt") == "yuv420p", video
          evidence = json.loads(Path("capture-artifacts/capture-evidence.json").read_text())
          assert evidence["finalUrl"].startswith("https://chat.padiem.net/")
          assert evidence["tierText"].lower().find("padiem plus") >= 0
          assert evidence["promptSubmitted"] is False
          assert evidence["loginPerformed"] is False
          assert evidence["filePickerOpened"] is False
          assert evidence["clawOpened"] is False
          print(f"CAPTURE_CONTRACT=PASS duration={duration:.2f}s size=1440x900")
          PY

      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: padiem-chat-product-film-v1-review
          path: |
            capture-artifacts/padiem-chat-product-film-v1.mp4
            capture-artifacts/padiem-chat-product-still-v1.webp
            capture-artifacts/capture-evidence.json
            capture-artifacts/film-metadata.json
            capture-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
