name: Responsive visual review

on:
  push:
    branches: [feat/new-homepage-20260806]
    paths-ignore:
      - review-evidence-auto/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/new-homepage-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tooling
        run: |
          npm init -y
          npm install playwright@1.54.2
          npx playwright install chromium
          python3 -m pip install pillow
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory static > /tmp/padiem-http.log 2>&1 &
          sleep 2
      - name: Capture responsive states
        run: |
          rm -rf responsive-review review-evidence-auto
          mkdir -p responsive-review review-evidence-auto
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const sizes = [
            ['1440x900', 1440, 900],
            ['1366x768', 1366, 768],
            ['390x844', 390, 844],
          ];
          const states = [
            ['home', null],
            ['company', 'about'],
            ['team', 'team'],
            ['contact', 'inquiry'],
          ];

          for (const [label, width, height] of sizes) {
            const context = await browser.newContext({
              viewport: { width, height },
              locale: 'ko-KR',
              deviceScaleFactor: 1,
            });
            await context.addInitScript(() => localStorage.setItem('padiem-language', 'ko'));
            const page = await context.newPage();
            await page.route('**/*', async route => {
              const url = route.request().url();
              if (url.startsWith('http://127.0.0.1:4173')) await route.continue();
              else await route.abort();
            });

            for (const [state, panel] of states) {
              await page.goto('http://127.0.0.1:4173/html/index1.html', { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(700);
              if (panel) {
                await page.locator(`[data-overlay="${panel}"]`).first().click({ force: true });
                await page.waitForTimeout(500);
              }
              await page.screenshot({ path: `responsive-review/${label}_${state}.png`, fullPage: false });
            }
            await context.close();
          }
          await browser.close();
          EOF
          node /tmp/capture.mjs
      - name: Build contact sheets
        run: |
          cat > /tmp/sheets.py <<'EOF'
          from pathlib import Path
          from PIL import Image, ImageDraw

          src = Path('responsive-review')
          out = Path('review-evidence-auto')
          out.mkdir(exist_ok=True)
          states = ['home', 'company', 'team', 'contact']
          sizes = [('1440x900', 1440), ('1366x768', 1366), ('390x844', 390)]

          for label, original_width in sizes:
              cards = []
              for state in states:
                  image = Image.open(src / f'{label}_{state}.png').convert('RGB')
                  target_width = 720 if original_width > 500 else 390
                  ratio = target_width / image.width
                  image = image.resize((target_width, round(image.height * ratio)), Image.Resampling.LANCZOS)
                  card = Image.new('RGB', (image.width, image.height + 30), 'white')
                  card.paste(image, (0, 30))
                  ImageDraw.Draw(card).text((10, 8), state, fill='black')
                  cards.append(card)

              cell_w = max(card.width for card in cards)
              cell_h = max(card.height for card in cards)
              sheet = Image.new('RGB', (cell_w * 2, cell_h * 2), (238, 240, 243))
              for index, card in enumerate(cards):
                  sheet.paste(card, ((index % 2) * cell_w, (index // 2) * cell_h))
              sheet.save(out / f'{label}_contact_sheet.jpg', quality=86, optimize=True)
          EOF
          python3 /tmp/sheets.py
      - name: Commit visual evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add review-evidence-auto/*.jpg
          git commit -m "test: update responsive visual evidence [skip netlify]"
          git push origin HEAD:feat/new-homepage-20260806
