    var stage=document.getElementById('stage'),drawer=document.getElementById('drawer'),viewer=document.getElementById('viewer'),viewerMedia=document.getElementById('viewerMedia');
    var dragging=false,pointerId=null,startX=0,startY=0,deltaX=0,moved=false,wheelLock=false;
    var kindLabel={message:'Message',image:'Photograph',video:'Moving memory',object:'Object',quote:'Message',type:'Typography'};
    function pad(n){return String(n).padStart(3,'0');}
    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
    function sync(animate){
      pages.forEach(function(page,i){
        var d=i-current,abs=Math.abs(d),transform,opacity=1,filter='none';
        page.classList.toggle('drag-preview',animate===false&&i===current);
        if(d===0){transform='translate3d(0,0,0) rotateY(0deg) scale(1)';page.style.zIndex='500';}
        else if(d>0){var fd=Math.min(d,5);transform='translate3d('+(-fd*21)+'px,'+(fd*4)+'px,'+(-fd*52)+'px) rotateY('+(-fd*2.2)+'deg) scale('+(1-fd*.018)+')';page.style.zIndex=String(400-d);opacity=Math.max(.34,1-d*.12);filter='saturate('+(1-d*.06)+')';}
        else{var pd=Math.min(-d,5),angle=Math.min(86+pd*7,116);transform='translate3d('+(pd*66)+'px,'+(pd*4)+'px,'+(-pd*58)+'px) rotateY('+angle+'deg) scale('+(1-pd*.018)+')';page.style.zIndex=String(300+pd);opacity=Math.max(.24,1-pd*.15);filter='saturate('+(1-pd*.08)+')';}
        page.style.transform=transform;page.style.opacity=opacity;page.style.filter=filter;
      });
      var active=pages[current],kind=active.dataset.kind;
      document.getElementById('currentNo').textContent=String(current+1).padStart(2,'0');
      document.getElementById('captionTitle').textContent=active.dataset.title||'Memory Page';
      document.getElementById('captionType').textContent=(kindLabel[kind]||'Memory')+' · Living memory';
      document.getElementById('progressBar').style.transform='scaleX('+((current+1)/total)+')';
      pages.forEach(function(p,i){var v=p.querySelector('video');if(!v)return;if(i===current&&!document.hidden){v.play().catch(function(){});}else{v.pause();}});
    }
    function go(index){current=clamp(index,0,total-1);sync(true);}
    function preview(dx){var page=pages[current],angle=clamp(dx*.28,-72,72),x=dx*.13;page.classList.add('drag-preview');page.style.transform='translate3d('+x+'px,0,4px) rotateY('+angle+'deg) scale(1)';}
    stage.addEventListener('pointerdown',function(e){if(e.button!==0||e.target.closest('.index-btn,.controls'))return;dragging=true;moved=false;pointerId=e.pointerId;startX=e.clientX;startY=e.clientY;deltaX=0;stage.classList.add('dragging');stage.setPointerCapture(pointerId);e.preventDefault();});
    stage.addEventListener('pointermove',function(e){if(!dragging||e.pointerId!==pointerId)return;deltaX=e.clientX-startX;if(Math.hypot(deltaX,e.clientY-startY)>6)moved=true;preview(deltaX);e.preventDefault();});
    function endDrag(e){if(!dragging||e.pointerId!==pointerId)return;dragging=false;stage.classList.remove('dragging');try{stage.releasePointerCapture(pointerId);}catch(err){}pages[current].classList.remove('drag-preview');if(Math.abs(deltaX)>52){go(current+(deltaX>0?1:-1));}else if(!moved){openPage(pages[current]);}else{sync(true);}pointerId=null;}
    stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
    stage.addEventListener('wheel',function(e){if(wheelLock)return;wheelLock=true;go(current+(e.deltaY>0||e.deltaX>0?1:-1));setTimeout(function(){wheelLock=false;},520);e.preventDefault();},{passive:false});
    function openPage(page){var kind=page.dataset.kind;if(kind==='video')openMedia('video',page.dataset.src,page.dataset.poster,page.dataset.title,'Featured moving memory');else if(kind==='image')openMedia('image',page.dataset.src,'',page.dataset.title,'LoveTree photograph');else go(current<total-1?current+1:0);}
    function openMedia(type,src,poster,title,meta){viewerMedia.innerHTML='';var media;if(type==='video'){media=document.createElement('video');media.src=src;media.poster=poster||'';media.controls=true;media.autoplay=true;media.playsInline=true;}else{media=document.createElement('img');media.src=src;media.alt=title;}viewerMedia.appendChild(media);document.getElementById('viewerTitle').textContent=title;document.getElementById('viewerMeta').textContent=meta;viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');if(type==='video')media.play().catch(function(){});}
    function closeViewer(){var v=viewerMedia.querySelector('video');if(v)v.pause();viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');setTimeout(function(){viewerMedia.innerHTML='';},280);}
    var first=['First','Living','Shared','Quiet','Red','Infinite','Hidden','Tender','Parallel','Golden'],second=['Memory','Journey','Signal','Portrait','Orbit','Chapter','Feeling','Archive','Promise'];
    var indexGrid=document.getElementById('indexGrid'),fullVideoBase='../../12_러브트리_리빙미디어스피어_인터랙티브대문_V1/assets/videos-v3/';
    for(var n=1;n<=89;n++)(function(no){var p=pad(no),title=first[(no-1)%first.length]+' '+second[Math.floor((no-1)/first.length)%second.length];var item=document.createElement('button');item.className='index-item';item.setAttribute('aria-label',title+' 영상 열기');item.innerHTML='<img src="assets/index-posters/poster-'+p+'.jpg" alt="" loading="lazy"><span>'+p+' '+title+'</span>';item.addEventListener('click',function(){drawer.classList.remove('open');var local={24:'024',46:'046',47:'047',71:'071'}[no],src=local?'assets/featured-videos/memory-'+local+'.mp4':fullVideoBase+'v3-'+p+'.mp4';openMedia('video',src,'assets/index-posters/poster-'+p+'.jpg',title,'LoveTree film · '+p+' / 089');});indexGrid.appendChild(item);})(n);
    document.getElementById('prev').addEventListener('click',function(){go(current-1);});document.getElementById('next').addEventListener('click',function(){go(current+1);});
    document.getElementById('indexTrigger').addEventListener('click',function(){drawer.classList.toggle('open');});document.getElementById('drawerClose').addEventListener('click',function(){drawer.classList.remove('open');});document.getElementById('viewerClose').addEventListener('click',closeViewer);
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){drawer.classList.remove('open');closeViewer();}if(e.key==='ArrowLeft')go(current-1);if(e.key==='ArrowRight')go(current+1);});
    document.addEventListener('visibilitychange',function(){sync(true);});document.getElementById('totalNo').textContent=String(total).padStart(2,'0');sync(true);
  })();
  </script>
</body>
