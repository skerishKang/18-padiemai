[build]
  publish = "public"
  command = "node scripts/build-cinematic-site.mjs"
  environment = { NODE_VERSION = "22" }

[[edge_functions]]
  function = "padiem-geo-language"
  path = "/"

[[ignore_files]]
  files = [
    "hugo.zip",
    "logs/*",
    "tests/*",
    "blog_old/*",
    "temp_files.txt",
    "temp_tree.txt",
    "tree.md"
  ]
