<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PADIEM Design / Living Media Sphere Pilot</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#0b0d0f;color:#f5f4ef;font-family:Inter,"Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif}
    .loading{height:100%;display:grid;place-items:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8f959b}
  </style>
</head>
<body>
  <div class="loading">PADIEM DESIGN / LOADING STUDY 04</div>
  <script>
    fetch('/design/living-media-sphere/')
      .then(r=>{if(!r.ok)throw new Error('source '+r.status);return r.text();})
      .then(html=>{
        html=html.replaceAll("'assets/","'/design/living-media-sphere/assets/");
        html=html.replace('<div class="top-meta">Living Media Sphere · Entrance Study 01</div>','<div class="top-meta padiem-top-meta"><span>PADIEM DESIGN / STUDY 04</span><strong>LIVING MEDIA SPHERE · LOVETREE · 2026</strong></div>');
        html=html.replace('<p>Drag anywhere to turn the sphere. Choose a memory from the library or click a card in front.</p></div>','<p>Drag anywhere to turn the sphere. Choose a memory from the library or click a card in front.</p><div class="padiem-credit"><span>A PADIEM INTERACTION STUDY</span><i></i><span>CREATED FOR LOVETREE</span></div></div>');
        html=html.replace('<section class="viewport" id="viewport" aria-label="Interactive LoveTree sphere">','<section class="viewport" id="viewport" aria-label="Interactive LoveTree sphere"><input class="padiem-note-toggle" id="padiemNoteToggle" type="checkbox"><label class="padiem-note-btn" for="padiemNoteToggle">PADIEM / ABOUT THIS WORK</label><div class="padiem-note"><label class="padiem-note-close" for="padiemNoteToggle" aria-label="Close">×</label><div class="padiem-note-kicker">PADIEM DESIGN ARCHIVE · STUDY 04</div><h3>Living Media Sphere</h3><p>An interactive spatial media study exploring how shared memories can stay discoverable, tactile and emotionally present.</p><div class="padiem-note-meta"><span>CREATED BY PADIEM</span><span>FOR LOVETREE</span><span>2026</span></div></div>');
        html=html.replace('<div class="status"><span id="visibleCount">36</span> objects','<div class="padiem-archive-signature">PADIEM DESIGN ARCHIVE · 04&nbsp;&nbsp; / &nbsp;&nbsp;MEMORY · MOTION · INTERACTION</div><div class="status"><span id="visibleCount">36</span> objects');
        const frameCss=`
          .padiem-top-meta{display:flex;align-items:center;gap:14px;font-size:8px;letter-spacing:.17em}.padiem-top-meta span{color:var(--ink);font-weight:750}.padiem-top-meta strong{font-size:8px;font-weight:520;color:var(--muted);letter-spacing:.16em}
          .padiem-credit{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:13px;font-size:7px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.padiem-credit i{width:20px;height:1px;background:var(--line);display:block}
          .padiem-note-toggle{position:absolute;opacity:0;pointer-events:none}.padiem-note-btn{position:absolute;z-index:35;left:18px;top:18px;border:0;border-left:2px solid var(--ink);background:rgba(248,248,245,.55);backdrop-filter:blur(12px);padding:7px 9px;color:var(--muted);font-size:7px;font-weight:650;letter-spacing:.17em;text-transform:uppercase;cursor:pointer;transition:.2s}.padiem-note-btn:hover{color:var(--ink);background:var(--panel)}body.dark .padiem-note-btn{background:rgba(15,17,19,.48)}
          .padiem-note{position:absolute;z-index:45;left:18px;top:52px;width:min(310px,calc(100% - 36px));padding:18px 18px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(28px);box-shadow:0 18px 55px rgba(15,18,20,.14);opacity:0;transform:translateY(-6px);pointer-events:none;transition:.22s}.padiem-note-toggle:checked~.padiem-note{opacity:1;transform:none;pointer-events:auto}.padiem-note-close{position:absolute;right:12px;top:10px;color:var(--muted);font-size:18px;cursor:pointer}.padiem-note-kicker{font-size:7px;letter-spacing:.19em;color:var(--muted);text-transform:uppercase}.padiem-note h3{margin:16px 0 9px;font-size:25px;line-height:1;letter-spacing:-.055em}.padiem-note p{margin:0;font-size:9px;line-height:1.6;color:var(--muted);max-width:250px}.padiem-note-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:17px;padding-top:12px;border-top:1px solid var(--line);font-size:7px;font-weight:650;letter-spacing:.15em;color:var(--ink);text-transform:uppercase}
          .padiem-archive-signature{position:absolute;z-index:12;left:20px;bottom:18px;font-size:7px;font-weight:620;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;pointer-events:none}.selection{bottom:42px}.gesture{bottom:18px}
          @media(max-width:940px){.padiem-top-meta{display:none}.padiem-note-btn{left:12px;top:12px}.padiem-note{left:12px;top:46px}.padiem-archive-signature{left:14px;bottom:14px;max-width:48%;line-height:1.5}.selection{bottom:52px}}
          @media(max-width:580px){.padiem-credit{font-size:6px;gap:6px}.padiem-credit i{width:12px}.padiem-archive-signature{font-size:6px}.padiem-note-btn{font-size:6px}.padiem-note{width:calc(100% - 24px)}}`;
        html=html.replace('</head>','<style>'+frameCss+'</style></head>');
        document.open();document.write(html);document.close();
      })
      .catch(err=>{document.body.innerHTML='<div class="loading">PADIEM PILOT LOAD FAILED · '+String(err.message)+'</div>';});
  </script>
</body>
</html>
