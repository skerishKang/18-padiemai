<!DOCTYPE html>
<html lang="ko">
<head>
  <div data-include="/html/components/meta.html"></div>
  <title>Contact - PadiemAI</title>
  <meta name="description" content="파디엠AI 문의하기. 서비스, 기술, 제휴, 채용 등 다양한 문의를 연락해 주세요.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components/video-showcase.css">
</head>
<body>
  <div data-include="/html/components/header.html"></div>

  <!-- 페이지 헤더 -->
  <section class="page-header contact-header">
    <div class="container">
      <h1>Contact</h1>
      <p class="page-subtitle">문의사항이 있으시면 언제든 말씀해 주세요<br>빠른 시일 내에 답변 드리겠습니다</p>
    </div>
  </section>

  <main>
    <!-- 문의 양식 -->
    <section class="bg-light fade-in">
      <div class="container">
        <h2 class="section-title">문의 양식</h2>
        <p class="section-subtitle">아래 양식을 작성하여 문의해 주세요. 빠른 시일 내에 답변 드리겠습니다.</p>

        <form id="contact-form" class="contact-form">
          <div class="form-group">
            <label for="name">이름 <span class="required">*</span></label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="form-group">
            <label for="email">이메일 <span class="required">*</span></label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="phone">연락처</label>
            <input type="tel" id="phone" name="phone">
          </div>

          <div class="form-group">
            <label for="company">회사/소속</label>
            <input type="text" id="company" name="company">
          </div>

          <div class="form-group">
            <label for="inquiry-type">문의 유형 <span class="required">*</span></label>
            <select id="inquiry-type" name="inquiry-type" required>
              <option value="">선택해주세요</option>
              <option value="service">서비스 문의</option>
              <option value="tech">기술 문의</option>
              <option value="partnership">제휴/협업 제안</option>
              <option value="career">채용 문의</option>
              <option value="other">기타</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">문의 내용 <span class="required">*</span></label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <div class="form-group checkbox">
            <input type="checkbox" id="privacy-agreement" name="privacy-agreement" required>
            <label for="privacy-agreement">개인정보 수집 및 이용에 동의합니다. <span class="required">*</span></label>
          </div>

          <div class="form-submit">
            <button type="submit" class="btn">문의하기</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div data-include="/html/components/footer.html"></div>
  <script src="/js/include.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/mobile-menu.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const contactForm = document.getElementById('contact-form');
      if (contactForm) {
        contactForm.addEventListener('submit', function(e) {
          e.preventDefault();
          alert('문의가 접수되었습니다. 빠른 시일 내에 답변 드리겠습니다.');
          contactForm.reset();
        });
      }
    });
  </script>
</body>
</html>
